<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>팀 스터디 신청</title>
  <!-- Tailwind CDN: 빌드 도구 없이 유틸리티 클래스를 그대로 쓰기 위함 (인터넷 연결 필요) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 신청서 PDF 자동 생성용: 화면을 이미지로 캡처(html2canvas) 후 PDF로 변환(jsPDF).
       한글은 jsPDF 기본 폰트로 그릴 수 없어서, 텍스트 대신 캡처한 이미지를 PDF에 넣는 방식을 씁니다. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Pretendard', 'Malgun Gothic', sans-serif; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { animation: spin 0.8s linear infinite; }
  </style>
</head>
<body class="bg-slate-50">
  <div id="app"></div>

  <script>
    /**
     * 팀 스터디 신청 시스템 - 프론트엔드 전체 (파일 하나)
     *
     * 이 파일은 두 가지 방식 모두로 배포할 수 있습니다.
     *  1) Google Apps Script 웹앱으로 그대로 배포 (Index 파일로 등록, 별도 호스팅 불필요)
     *  2) 이 HTML 파일 하나만 Vercel / Netlify / GitHub Pages 등에 정적 파일로 올리기
     *
     * 어느 쪽이든 백엔드(Google Apps Script)와는 fetch + 아래 GAS_API_URL로 통신합니다.
     * (google.script.run을 쓰지 않기 때문에 어디에 올려도 동일하게 동작합니다)
     *
     * ⚠️ 배포 전 딱 한 줄만 수정하면 됩니다: 바로 아래 GAS_API_URL에
     * Apps Script를 "웹 앱"으로 배포했을 때 나오는 주소를 붙여넣어주세요.
     * (예: https://script.google.com/macros/s/AKfycb.../exec)
     */
    var GAS_API_URL = 'https://script.google.com/macros/s/AKfycbww_kxbO_vB8CW5_Z4kXpRwmUooRFi-ayO7oRJDXlJ_tEkBOXH9ecn0d_ZnCk_eP9Sm5Q/exec';

    // 원티드 로고 (구글 드라이브 공유 이미지, thumbnail 엔드포인트 사용 - uc?export=view보다 핫링크가 안정적임).
    // 다른 이미지로 바꾸고 싶으면 이 URL의 id= 값만 교체하면 됩니다. (드라이브 파일이 "링크가 있는 모든 사용자"로 공유되어 있어야 함)
    var BRAND_LOGO_HTML = '<img src="https://drive.google.com/thumbnail?id=1sXGEGVtD7joLFSlo-rCeRhHlGSdHY-pE&sz=w400" alt="wanted" class="h-8 w-auto inline-block align-middle">' +
      ' <span class="text-slate-400 font-medium align-middle">| 팀 스터디</span>';

    // ----------------------------- 공통 유틸 -----------------------------

    /** HTML에 사용자 입력값을 넣을 때 XSS 방지를 위해 항상 이 함수로 이스케이프합니다. */
    function escapeHtml(value) {
      if (value === null || value === undefined) return '';
      return String(value).replace(/[&<>"']/g, function (ch) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
      });
    }

    /** GAS_API_URL이 설정되어 있는지 확인합니다. */
    function assertApiUrlConfigured_() {
      if (!GAS_API_URL || GAS_API_URL.indexOf('PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE') !== -1) {
        throw new Error('이 페이지 상단의 GAS_API_URL이 아직 설정되지 않았습니다. Apps Script 웹앱 배포 주소를 넣어주세요.');
      }
    }

    /**
     * 조회(GET) 요청. Google Apps Script 웹앱은 CORS 프리플라이트(OPTIONS)를 제대로
     * 처리하지 못하므로, 쿼리 파라미터를 쓰는 단순 GET 요청으로만 통신합니다.
     */
    function apiGet(action, params) {
      assertApiUrlConfigured_();
      var url = new URL(GAS_API_URL);
      url.searchParams.set('action', action);
      Object.keys(params || {}).forEach(function (key) {
        if (params[key] !== undefined && params[key] !== null) url.searchParams.set(key, params[key]);
      });
      return fetch(url.toString())
        .then(function (res) { return res.json(); })
        .then(function (json) {
          if (!json.success) throw new Error(json.error || '알 수 없는 오류가 발생했습니다.');
          return json.data;
        });
    }

    /**
     * 생성/변경(POST) 요청. Content-Type을 text/plain으로 보내 프리플라이트를 피합니다.
     * (Content-Type을 application/json으로 바꾸면 브라우저가 프리플라이트를 발생시켜
     * GAS가 이를 처리하지 못하고 요청이 실패하니 그대로 두세요)
     */
    function apiPost(action, payload) {
      assertApiUrlConfigured_();
      return fetch(GAS_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: action, payload: payload })
      })
        .then(function (res) { return res.json(); })
        .then(function (json) {
          if (!json.success) throw new Error(json.error || '알 수 없는 오류가 발생했습니다.');
          return json.data;
        });
    }

    var api = {
      getCourses: function () { return apiGet('courses'); },
      getApplication: function (id) { return apiGet('get', { id: id }); },
      findForReport: function (courseName, applicantName) { return apiGet('findReport', { courseName: courseName, applicantName: applicantName }); },
      adminList: function (password) { return apiGet('adminList', { password: password }); },
      adminGet: function (id, password) { return apiGet('adminGet', { id: id, password: password }); },
      createApplication: function (payload) { return apiPost('create', payload); },
      attachApplicationPdf: function (payload) { return apiPost('attachApplicationPdf', payload); },
      approve: function (payload) { return apiPost('approve', payload); },
      reject: function (payload) { return apiPost('reject', payload); },
      submitReport: function (payload) { return apiPost('submitReport', payload); },
      markComplete: function (payload) { return apiPost('markComplete', payload); }
    };

    // 관리자 비밀번호는 세션에만 저장합니다 (탭을 닫으면 사라짐, 정식 로그인 기능 전 임시 방편)
    var ADMIN_STORAGE_KEY = 'team-study-admin-password';
    function saveAdminPassword(p) { sessionStorage.setItem(ADMIN_STORAGE_KEY, p); }
    function getAdminPassword() {
      var v = sessionStorage.getItem(ADMIN_STORAGE_KEY);
      // 일부 iframe/webview 환경에서는 저장된 값이 없어도 문자열 "null"/"undefined"가
      // 반환되는 경우가 있어, 그런 경우까지 "로그인 안 됨"으로 취급합니다.
      if (!v || v === 'null' || v === 'undefined') return null;
      return v;
    }
    function clearAdminPassword() { sessionStorage.removeItem(ADMIN_STORAGE_KEY); }

    var STATUS_BADGE_STYLE = {
      '신청완료': 'bg-slate-100 text-slate-700',
      '승인': 'bg-emerald-100 text-emerald-700',
      '반려': 'bg-rose-100 text-rose-700',
      '보고서 제출': 'bg-blue-100 text-blue-700',
      '완료': 'bg-violet-100 text-violet-700'
    };
    function statusBadge(status) {
      var style = STATUS_BADGE_STYLE[status] || 'bg-slate-100 text-slate-700';
      return '<span class="inline-block px-2.5 py-1 rounded-full text-xs font-semibold ' + style + '">' + escapeHtml(status) + '</span>';
    }

    function setApp(html) {
      document.getElementById('app').innerHTML = html;
    }

    function val(id) {
      var el = document.getElementById(id);
      return el ? el.value.trim() : '';
    }

    function errorHtml(message) {
      return '<div class="rounded-lg bg-rose-50 border border-rose-200 text-rose-600 text-sm px-4 py-3 mb-5">' + escapeHtml(message) + '</div>';
    }

    function loadingHtml(label) {
      return '<div class="flex flex-col items-center justify-center py-16 text-slate-400">' +
        '<div class="w-8 h-8 border-2 border-slate-200 border-t-blue-600 rounded-full spinner mb-3"></div>' +
        '<p class="text-sm">' + escapeHtml(label || '불러오는 중입니다...') + '</p></div>';
    }

    function formField(label, required, innerHtml, hint) {
      return '<div class="mb-5">' +
        '<label class="block text-sm font-semibold text-slate-700 mb-1.5">' + escapeHtml(label) +
        (required ? '<span class="text-rose-500 ml-0.5">*</span>' : '') + '</label>' +
        innerHtml +
        (hint ? '<p class="mt-1 text-xs text-slate-400">' + escapeHtml(hint) + '</p>' : '') +
        '</div>';
    }

    function textInput(id, placeholder, type, value) {
      return '<input id="' + id + '" type="' + (type || 'text') + '" ' +
        'class="w-full rounded-lg border border-slate-300 px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" ' +
        'placeholder="' + escapeHtml(placeholder || '') + '" value="' + escapeHtml(value || '') + '">';
    }

    function textArea(id, rows) {
      return '<textarea id="' + id + '" rows="' + (rows || 3) + '" ' +
        'class="w-full rounded-lg border border-slate-300 px-3.5 py-2.5 text-sm resize-none focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"></textarea>';
    }

    function selectHtml(id, optionsHtml) {
      return '<select id="' + id + '" class="w-full rounded-lg border border-slate-300 px-3.5 py-2.5 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">' + optionsHtml + '</select>';
    }

    function primaryButton(id, label, extraClass, type) {
      return '<button id="' + id + '" type="' + (type || 'submit') + '" class="px-4 py-2.5 rounded-lg font-medium text-sm bg-blue-600 text-white hover:bg-blue-700 disabled:bg-slate-300 ' + (extraClass || '') + '">' + escapeHtml(label) + '</button>';
    }

    function secondaryLink(href, label) {
      return '<a href="' + href + '" class="px-4 py-2.5 rounded-lg font-medium text-sm bg-white text-slate-700 border border-slate-300 hover:bg-slate-50 inline-block">' + escapeHtml(label) + '</a>';
    }

    function card(innerHtml, extraClass) {
      return '<div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6 sm:p-8 ' + (extraClass || '') + '">' + innerHtml + '</div>';
    }

    function pageHeading(title, subtitle) {
      return '<h2 class="text-lg font-bold text-slate-900 mb-1">' + escapeHtml(title) + '</h2>' +
        (subtitle ? '<p class="text-sm text-slate-400 mb-6">' + escapeHtml(subtitle) + '</p>' : '<div class="mb-6"></div>');
    }

    // ----------------------------- 상단 탭 네비게이션 -----------------------------
    // 여러 화면(신청/수행보고/관리자)을 링크로 따로 찾아다니지 않도록,
    // 항상 화면 맨 위에 탭 형태로 붙여둡니다.

    function navBar(activeKey) {
      var isAdmin = !!getAdminPassword();
      var tabs = [
        { key: 'apply', label: '팀 스터디 신청', href: '#/' },
        { key: 'report', label: '수행 보고서 제출', href: '#/report' },
        { key: 'admin', label: '관리자', href: isAdmin ? '#/admin/list' : '#/admin' }
      ];
      var tabsHtml = tabs.map(function (t) {
        var activeClass = (t.key === activeKey)
          ? 'bg-slate-900 text-white'
          : 'text-slate-500 hover:text-slate-800 hover:bg-slate-100';
        return '<a href="' + t.href + '" class="px-4 py-2 rounded-full text-sm font-medium transition-colors ' + activeClass + '">' + escapeHtml(t.label) + '</a>';
      }).join('');

      var rightHtml = '';
      // 관리자 뱃지/로그아웃 버튼은 실제로 관리자 화면을 보고 있을 때만 노출합니다.
      // (세션 자체는 탭을 옮겨도 유지되지만, 신청/보고서 제출 같은 공개 화면에서는 표시하지 않습니다)
      if (isAdmin && activeKey === 'admin') {
        rightHtml = '<div class="flex items-center gap-3">' +
          '<span class="text-xs text-slate-400 hidden sm:inline">관리자 모드</span>' +
          '<button id="navLogoutBtn" class="px-3 py-1.5 rounded-full text-sm border border-slate-300 text-slate-600 hover:bg-slate-50">로그아웃</button>' +
          '</div>';
      }

      return '<header class="bg-white border-b border-slate-100 sticky top-0 z-10">' +
        '<div class="max-w-4xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-4">' +
        '<div class="flex items-center gap-1 sm:gap-2 overflow-x-auto">' +
        '<span class="mr-2 whitespace-nowrap text-sm">' + BRAND_LOGO_HTML + '</span>' +
        '<nav class="flex items-center gap-1">' + tabsHtml + '</nav>' +
        '</div>' + rightHtml +
        '</div></header>';
    }

    /** 공통 페이지 레이아웃: 상단 탭 + 본문 영역 */
    function page(activeKey, bodyHtml, maxWidthClass) {
      maxWidthClass = maxWidthClass || 'max-w-3xl';
      return '<div class="min-h-screen bg-slate-50">' +
        navBar(activeKey) +
        '<main class="' + maxWidthClass + ' mx-auto px-4 sm:px-6 py-8">' + bodyHtml + '</main>' +
        '</div>';
    }

    /** page()로 렌더링한 뒤 공통으로 필요한 이벤트(로그아웃 버튼 등)를 걸어줍니다. */
    function wireCommonEvents() {
      var logoutBtn = document.getElementById('navLogoutBtn');
      if (logoutBtn) {
        logoutBtn.addEventListener('click', function () {
          clearAdminPassword();
          location.hash = '#/';
        });
      }
    }

    // ----------------------------- 라우터 -----------------------------

    function getRouteParts() {
      var hash = location.hash.replace(/^#\/?/, '');
      return hash.split('/').filter(Boolean).map(decodeURIComponent);
    }

    function router() {
      var parts = getRouteParts();
      if (parts.length === 0) return renderApply();
      if (parts[0] === 'complete') return renderComplete(parts[1]);
      if (parts[0] === 'report') return renderReport(parts[1]);
      if (parts[0] === 'admin') {
        if (parts[1] === 'list') return renderAdminList();
        if (parts[1] === 'detail') return renderAdminDetail(parts[2]);
        return renderAdminLogin();
      }
      return renderNotFound();
    }

    window.addEventListener('hashchange', router);
    window.addEventListener('DOMContentLoaded', router);

    // ----------------------------- 과정 드롭다운(공용) -----------------------------

    async function loadCourseOptionsHtml() {
      try {
        var courses = await api.getCourses();
        return {
          error: null,
          html: '<option value="">참여 과정을 선택해주세요</option>' +
            courses.map(function (c) { return '<option value="' + escapeHtml(c) + '">' + escapeHtml(c) + '</option>'; }).join('')
        };
      } catch (err) {
        return { error: err.message, html: '<option value="">과정 목록을 불러오지 못했습니다</option>' };
      }
    }

    // ----------------------------- 스터디 계획서 (주차별 표) -----------------------------
    // 신청 폼 안에서만 쓰는 상태입니다. 주차는 항상 배열 순서(index+1)로 자동 부여됩니다.

    var studyPlanRows = [];

    function resetStudyPlanRows() {
      studyPlanRows = [{ content: '' }, { content: '' }, { content: '' }, { content: '' }];
    }

    function syncStudyPlanFromDom() {
      var inputs = document.querySelectorAll('.plan-content-input');
      inputs.forEach(function (inp) {
        var idx = Number(inp.getAttribute('data-index'));
        if (studyPlanRows[idx]) studyPlanRows[idx].content = inp.value;
      });
    }

    function renderStudyPlanTableHtml() {
      var rowsHtml = studyPlanRows.map(function (row, i) {
        var removeBtn = studyPlanRows.length > 1
          ? '<button type="button" class="remove-plan-row text-rose-400 hover:text-rose-600 text-sm" data-index="' + i + '">✕</button>'
          : '';
        return '<tr>' +
          '<td class="px-3 py-2 font-medium text-slate-600 whitespace-nowrap border-t border-slate-100">' + (i + 1) + '주차</td>' +
          '<td class="px-3 py-2 border-t border-slate-100"><input type="text" class="plan-content-input w-full rounded border border-slate-300 px-2 py-1.5 text-sm" data-index="' + i + '" value="' + escapeHtml(row.content || '') + '" placeholder="이번 주차 계획을 입력해주세요"></td>' +
          '<td class="px-3 py-2 text-center border-t border-slate-100">' + removeBtn + '</td>' +
          '</tr>';
      }).join('');

      return '<table class="w-full text-sm border border-slate-200 rounded-lg overflow-hidden mb-2">' +
        '<thead><tr class="bg-slate-50 text-slate-500 text-left"><th class="px-3 py-2 w-20">주차</th><th class="px-3 py-2">계획 내용</th><th class="w-10"></th></tr></thead>' +
        '<tbody id="studyPlanBody">' + rowsHtml + '</tbody></table>' +
        '<button type="button" id="addPlanRowBtn" class="text-sm text-blue-600 hover:underline">+ 주차 추가</button>';
    }

    function wireStudyPlanEvents() {
      var addBtn = document.getElementById('addPlanRowBtn');
      if (addBtn) {
        addBtn.addEventListener('click', function () {
          syncStudyPlanFromDom();
          studyPlanRows.push({ content: '' });
          rerenderStudyPlanTable();
        });
      }
      document.querySelectorAll('.remove-plan-row').forEach(function (btn) {
        btn.addEventListener('click', function () {
          syncStudyPlanFromDom();
          var idx = Number(btn.getAttribute('data-index'));
          studyPlanRows.splice(idx, 1);
          rerenderStudyPlanTable();
        });
      });
    }

    function rerenderStudyPlanTable() {
      document.getElementById('studyPlanWrap').innerHTML = renderStudyPlanTableHtml();
      wireStudyPlanEvents();
    }

    // ----------------------------- 신청서 PDF 자동 생성 -----------------------------
    // 신청 완료 시, 입력한 내용을 신청 화면과 비슷한 형태로 그려서 이미지로 캡처한 뒤
    // PDF로 만들어 Drive "신청서" 폴더에 저장하고 URL을 시트에 기록합니다.

    /** 신청 내용을 문서 형태로 보여주는 정적 HTML (PDF 캡처용, 실제 화면에는 안 보이게 렌더링) */
    function buildApplicationPrintHtml(payload, headerLabel) {
      function field(label, value) {
        return '<div style="margin-bottom:16px;">' +
          '<div style="font-size:12px;font-weight:700;color:#64748b;margin-bottom:4px;">' + escapeHtml(label) + '</div>' +
          '<div style="font-size:14px;color:#0f172a;white-space:pre-wrap;border:1px solid #e2e8f0;border-radius:8px;padding:10px 14px;background:#ffffff;">' + escapeHtml(value || '-') + '</div>' +
          '</div>';
      }

      var supportLabel = (payload.supportItems && payload.supportItems.length) ? payload.supportItems.join(', ') : '없음';

      var planRowsHtml = payload.studyPlan.map(function (row) {
        return '<tr>' +
          '<td style="padding:8px 12px;border:1px solid #e2e8f0;font-weight:600;white-space:nowrap;background:#fff;">' + escapeHtml(row.week) + '</td>' +
          '<td style="padding:8px 12px;border:1px solid #e2e8f0;background:#fff;">' + escapeHtml(row.content || '') + '</td>' +
          '</tr>';
      }).join('');

      return '<div style="width:680px;padding:32px;background:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,\'Segoe UI\',\'Malgun Gothic\',sans-serif;">' +
        '<div style="font-size:12px;color:#94a3b8;margin-bottom:6px;">' + escapeHtml(headerLabel) + '</div>' +
        '<h1 style="font-size:20px;font-weight:800;color:#0f172a;margin:0 0 20px 0;">팀 스터디 신청서</h1>' +
        field('참여 과정', payload.courseName) +
        field('이름', payload.applicantName) +
        field('스터디명', payload.studyName) +
        field('인원수', payload.memberCount + '명') +
        field('스터디 소개 및 목표', payload.introGoal) +
        field('팀원 명단', payload.memberList) +
        field('희망 지원 항목', supportLabel) +
        (payload.bookTitle ? field('도서명', payload.bookTitle) : '') +
        '<div style="font-size:12px;font-weight:700;color:#64748b;margin-bottom:6px;">스터디 계획서</div>' +
        '<table style="width:100%;border-collapse:collapse;">' +
        '<thead><tr>' +
        '<th style="text-align:left;padding:8px 12px;border:1px solid #e2e8f0;background:#f1f5f9;width:70px;">주차</th>' +

    /**
     * payload와 신청번호(id)를 받아 PDF를 만들고 base64로 반환합니다.
     * html2canvas/jsPDF는 <head>에서 CDN으로 불러온 전역 객체(html2canvas, window.jspdf.jsPDF)를 사용합니다.
     */
    async function generateApplicationPdfBase64(applicationId, payload) {
      var container = document.createElement('div');
      container.style.position = 'fixed';
      container.style.left = '-99999px';
      container.style.top = '0';
      container.innerHTML = buildApplicationPrintHtml(payload, payload.courseName + ' · ' + applicationId);
      document.body.appendChild(container);

      try {
        var canvas = await html2canvas(container.firstChild, { scale: 2, backgroundColor: '#f8fafc' });
        var imgWidth = 210; // A4 가로(mm)
        var pageHeight = 297; // A4 세로(mm)
        var imgHeight = (canvas.height * imgWidth) / canvas.width;
        var heightLeft = imgHeight;
        var imgData = canvas.toDataURL('image/png');
        var pdf = new window.jspdf.jsPDF('p', 'mm', 'a4');
        var position = 0;

        pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
        heightLeft -= pageHeight;
        while (heightLeft > 0) {
          position = heightLeft - imgHeight;
          pdf.addPage();
          pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
          heightLeft -= pageHeight;
        }

        var datauri = pdf.output('datauristring');
        return {
          base64: datauri.substring(datauri.indexOf(',') + 1),
          filename: applicationId + '_신청서.pdf',
          mimeType: 'application/pdf'
        };
      } finally {
        document.body.removeChild(container);
      }
    }

      if (!p.introGoal) return '스터디 소개 및 목표를 입력해주세요.';
      if (!p.memberList) return '팀원 명단을 입력해주세요.';

    function validateFile(file) {
      var allowedExt = ['.pdf'];
      var maxMb = 10;
      var name = file.name.toLowerCase();
      var ok = allowedExt.some(function (ext) { return name.endsWith(ext); });
      if (!ok) return allowedExt.join(', ') + ' 형식의 파일만 첨부할 수 있습니다.';
      if (file.size > maxMb * 1024 * 1024) return '파일 용량은 ' + maxMb + 'MB를 초과할 수 없습니다.';
      return null;
    }

    function encodeFileToBase64(file) {
      return new Promise(function (resolve, reject) {
        var reader = new FileReader();
        reader.onload = function () {
          var result = reader.result;
          var base64 = result.substring(result.indexOf(',') + 1);
          resolve({ base64: base64, filename: file.name, mimeType: file.type || 'application/octet-stream' });
        };
        reader.onerror = function () { reject(new Error('파일을 읽는 중 오류가 발생했습니다.')); };
        reader.readAsDataURL(file);
      });
    }

      try {
        await api.adminList(password); // 비밀번호가 틀리면 여기서 예외 발생
        saveAdminPassword(password);
        location.hash = '#/admin/list';
      } catch (err) {
        errBox.innerHTML = errorHtml(err.message || '로그인에 실패했습니다.');
        btn.disabled = false;
        btn.textContent = '로그인';
      }
    }

    // ----------------------------- 관리자 목록 (작업지시서 5번) -----------------------------

    async function renderAdminList() {
      var password = getAdminPassword();
      if (!password) { location.hash = '#/admin'; return; }

      setApp(page('admin', loadingHtml(), 'max-w-5xl'));
      wireCommonEvents();

      var applications, error;
      try {
        applications = await api.adminList(password);
      } catch (err) {
        error = err.message;
      }

      if (error) {
        setApp(page('admin', pageHeading('스터디 신청 관리', '') + errorHtml(error), 'max-w-5xl'));
        wireCommonEvents();
        return;
      }

      var tableHtml;
      if (applications.length === 0) {
        tableHtml = '<p class="text-center text-slate-400 py-16 text-sm">접수된 신청이 없습니다.</p>';
      } else {
        var rows = applications.map(function (a) {
          return '<tr class="border-t border-slate-100 hover:bg-slate-50 cursor-pointer" onclick="location.hash=\'#/admin/detail/' + encodeURIComponent(a.id) + '\'">' +
            '<td class="px-4 py-3 font-medium text-slate-700">' + escapeHtml(a.id) + '</td>' +
            '<td class="px-4 py-3 text-slate-500">' + escapeHtml(a.createdAt) + '</td>' +
            '<td class="px-4 py-3 text-slate-600">' + escapeHtml(a.courseName) + '</td>' +
            '<td class="px-4 py-3 text-slate-600">' + escapeHtml(a.applicantName) + '</td>' +
            '<td class="px-4 py-3 text-slate-600 max-w-xs truncate">' + escapeHtml(a.studyName) + '</td>' +
            '<td class="px-4 py-3">' + statusBadge(a.status) + '</td>' +
            '</tr>';
        }).join('');

        tableHtml = '<div class="overflow-x-auto rounded-2xl border border-slate-100 bg-white"><table class="w-full text-sm">' +
          '<thead><tr class="bg-slate-50 text-slate-500 text-left">' +
          '<th class="px-4 py-3 font-medium">신청번호</th><th class="px-4 py-3 font-medium">신청일</th>' +
          '<th class="px-4 py-3 font-medium">과정명</th><th class="px-4 py-3 font-medium">이름</th>' +
          '<th class="px-4 py-3 font-medium">스터디명</th><th class="px-4 py-3 font-medium">상태</th></tr></thead>' +
          '<tbody>' + rows + '</tbody></table></div>';
      }

      var headerRow = '<div class="flex items-center justify-between mb-4">' +
        pageHeading('스터디 신청 관리', '전체 ' + applications.length + '건') +
        '<button id="reloadBtn" class="px-4 py-2.5 rounded-lg font-medium text-sm bg-white text-slate-700 border border-slate-300 hover:bg-slate-50 h-fit">새로고침</button>' +
        '</div>';

      setApp(page('admin', headerRow + tableHtml, 'max-w-5xl'));
      wireCommonEvents();
      document.getElementById('reloadBtn').addEventListener('click', renderAdminList);
    }

    // ----------------------------- 관리자 상세 (작업지시서 5, 7번) -----------------------------

    /** 스터디계획서(JSON 문자열)를 표로 렌더링합니다. 파싱 실패 시 원문 그대로 보여줍니다. */
    function renderStudyPlanReadOnly(studyPlanJson) {
      var rows = [];
      try {
        rows = JSON.parse(studyPlanJson || '[]');
      } catch (e) {
        return '<p class="text-sm text-slate-700 whitespace-pre-wrap">' + escapeHtml(studyPlanJson) + '</p>';
      }
      if (!Array.isArray(rows) || rows.length === 0) {
        return '<p class="text-sm text-slate-400">입력된 계획이 없습니다.</p>';
      }
      var rowsHtml = rows.map(function (r) {
        return '<tr><td class="px-3 py-2 font-medium text-slate-600 whitespace-nowrap border-t border-slate-100">' + escapeHtml(r.week) + '</td>' +
          '<td class="px-3 py-2 text-slate-700 border-t border-slate-100 whitespace-pre-wrap">' + escapeHtml(r.content) + '</td></tr>';
      }).join('');
      return '<table class="w-full text-sm border border-slate-200 rounded-lg overflow-hidden">' +
        '<thead><tr class="bg-slate-50 text-slate-500 text-left"><th class="px-3 py-2 w-20">주차</th><th class="px-3 py-2">계획 내용</th></tr></thead>' +
        '<tbody>' + rowsHtml + '</tbody></table>';
    }

    async function renderAdminDetail(id) {
      var password = getAdminPassword();
      if (!password) { location.hash = '#/admin'; return; }

      setApp(page('admin', loadingHtml()));
      wireCommonEvents();

      var application, error;
      try {
        application = await api.adminGet(id, password);
      } catch (err) {
        error = err.message;
      }

      if (error) {
        setApp(page('admin', pageHeading('신청 상세', id) + errorHtml(error)));
        wireCommonEvents();
        return;
      }

      renderAdminDetailBody(application, password);
    }

    function renderAdminDetailBody(application, password) {
      var id = application.id;

      var basicRows = [
        ['인원수', application.memberCount + '명'],
        ['스터디 소개 및 목표', application.introGoal],
        ['팀원 명단', application.memberList]
      ].map(function (pair) {
        return '<div><dt class="text-xs font-semibold text-slate-400 mb-1">' + escapeHtml(pair[0]) + '</dt>' +
          '<dd class="text-sm text-slate-700 whitespace-pre-wrap">' + escapeHtml(pair[1]) + '</dd></div>';
      }).join('');

      var supportHtml = application.supportItems
        ? '<div><dt class="text-xs font-semibold text-slate-400 mb-1">희망 지원 항목</dt><dd class="text-sm text-slate-700">' + escapeHtml(application.supportItems) + '</dd></div>'
        : '';
      var bookHtml = application.bookTitle
        ? '<div><dt class="text-xs font-semibold text-slate-400 mb-1">도서명</dt><dd class="text-sm text-slate-700">' + escapeHtml(application.bookTitle) + '</dd></div>'
        : '';
      var approverCommentHtml = application.approverComment
        ? '<div><dt class="text-xs font-semibold text-slate-400 mb-1">관리자 코멘트</dt><dd class="text-sm text-blue-700 whitespace-pre-wrap bg-blue-50 rounded-lg px-3 py-2">' + escapeHtml(application.approverComment) + '</dd></div>'
        : '';
      var rejectReasonHtml = application.rejectReason
        ? '<div><dt class="text-xs font-semibold text-slate-400 mb-1">반려 사유</dt><dd class="text-sm text-rose-600 whitespace-pre-wrap">' + escapeHtml(application.rejectReason) + '</dd></div>'
        : '';
      var applicationPdfHtml = application.applicationPdfUrl
        ? '<div><dt class="text-xs font-semibold text-slate-400 mb-1">신청서 PDF</dt><dd class="text-sm"><a href="' + escapeHtml(application.applicationPdfUrl) + '" target="_blank" rel="noreferrer" class="text-blue-600 hover:underline">PDF 열기</a></dd></div>'
        : '';

      var summaryCard = card(
        '<div class="flex items-start justify-between mb-6">' +
        '<div><p class="text-sm text-slate-500">' + escapeHtml(application.courseName) + '</p>' +
        '<h2 class="text-lg font-bold text-slate-900">' + escapeHtml(application.studyName) + '</h2>' +
        '<p class="text-sm text-slate-500 mt-1">' + escapeHtml(application.applicantName) + ' · 신청일 ' + escapeHtml(application.createdAt) + '</p></div>' +
        statusBadge(application.status) + '</div>' +
        '<dl class="space-y-4 mb-6">' + basicRows + supportHtml + bookHtml + applicationPdfHtml + approverCommentHtml + rejectReasonHtml + '</dl>' +
        '<div><dt class="text-xs font-semibold text-slate-400 mb-2">스터디 계획서</dt><dd>' + renderStudyPlanReadOnly(application.studyPlan) + '</dd></div>'
      );

      var actionCard = '';
      var canChangeDecision = ['신청완료', '승인', '반려'].indexOf(application.status) !== -1;
      if (canChangeDecision) {
        var decisionNoticeHtml = application.status !== '신청완료'
          ? '<p class="text-xs text-slate-400 mb-4">현재 상태: ' + escapeHtml(application.status) + '. 아래에서 승인/반려를 다시 변경할 수 있습니다.</p>'
          : '';
        actionCard = card(
          decisionNoticeHtml +
          formField('승인자 이름', true, textInput('f_approver', '본인 이름을 입력해주세요', 'text', application.approver)) +
          formField('코멘트', false, textArea('f_approverComment', 3), '승인과 함께 신청자에게 남길 코멘트가 있으면 입력해주세요. 수행보고 페이지에서 신청자에게 보여집니다.') +
          '<div class="flex gap-2">' +
          '<button id="approveBtn" class="flex-1 px-4 py-2.5 rounded-lg font-medium text-sm bg-blue-600 text-white hover:bg-blue-700">승인</button>' +
          '<button id="rejectBtn" class="flex-1 px-4 py-2.5 rounded-lg font-medium text-sm bg-rose-500 text-white hover:bg-rose-600">반려</button>' +
          '</div>'
        );
      } else if (application.status === '보고서 제출' || application.status === '완료') {
        var fileLink = application.reportFileUrl
          ? '<a href="' + escapeHtml(application.reportFileUrl) + '" target="_blank" rel="noreferrer" class="text-sm text-blue-600 hover:underline">결과 파일 열기</a>'
          : '';
        var completeBtnHtml = application.status === '보고서 제출'
          ? '<div class="mt-4"><button id="completeBtn" class="px-4 py-2.5 rounded-lg font-medium text-sm bg-blue-600 text-white hover:bg-blue-700">완료 처리</button></div>'
          : '';
        actionCard = card(
          '<h3 class="text-sm font-bold text-slate-900 mb-4">수행보고</h3>' +
          '<p class="text-sm text-slate-700 whitespace-pre-wrap mb-3">' + escapeHtml(application.reportContent) + '</p>' +
          fileLink + completeBtnHtml
        );
      }

      var bodyHtml = pageHeading('신청 상세', id) +
        '<div class="mb-4">' + secondaryLink('#/admin/list', '목록으로') + '</div>' +
        '<div class="space-y-6">' + summaryCard + actionCard + '</div>' +
        '<div id="actionError" class="mt-4"></div>' +
        '<div id="rejectDialogRoot"></div>';

      setApp(page('admin', bodyHtml));
      wireCommonEvents();

      if (canChangeDecision) {
        document.getElementById('approveBtn').addEventListener('click', function () { handleApprove(id, password); });
        document.getElementById('rejectBtn').addEventListener('click', function () { showRejectDialog(id, password); });
      }
      if (application.status === '보고서 제출') {
        document.getElementById('completeBtn').addEventListener('click', function () { handleMarkComplete(id, password); });
      }
    }

    async function handleApprove(id, password) {
      var approver = val('f_approver');
      var comment = val('f_approverComment');
      var errBox = document.getElementById('actionError');
      errBox.innerHTML = '';
      if (!approver) {
        errBox.innerHTML = errorHtml('승인자 이름을 입력해주세요.');
        return;
      }
      try {
        await api.approve({ id: id, approver: approver, comment: comment, password: password });
        renderAdminDetail(id);
      } catch (err) {
        errBox.innerHTML = errorHtml(err.message);
      }
    }

    function showRejectDialog(id, password) {
      var approver = val('f_approver');
      var errBox = document.getElementById('actionError');
      errBox.innerHTML = '';
      if (!approver) {
        errBox.innerHTML = errorHtml('승인자 이름을 입력해주세요.');
        return;
      }

      document.getElementById('rejectDialogRoot').innerHTML =
        '<div class="fixed inset-0 bg-black/30 flex items-center justify-center p-4 z-50">' +
        '<div class="bg-white rounded-2xl shadow-lg max-w-md w-full p-6">' +
        '<h2 class="text-base font-bold text-slate-900 mb-3">반려 사유 입력</h2>' +
        textArea('f_rejectReason', 4) +
        '<div class="flex justify-end gap-2 mt-4">' +
        '<button id="rejectCancelBtn" class="px-4 py-2.5 rounded-lg font-medium text-sm bg-white text-slate-700 border border-slate-300 hover:bg-slate-50">취소</button>' +
        '<button id="rejectConfirmBtn" class="px-4 py-2.5 rounded-lg font-medium text-sm bg-rose-500 text-white hover:bg-rose-600">반려하기</button>' +
        '</div></div></div>';

      document.getElementById('rejectCancelBtn').addEventListener('click', function () {
        document.getElementById('rejectDialogRoot').innerHTML = '';
      });
      document.getElementById('rejectConfirmBtn').addEventListener('click', function () {
        handleReject(id, approver, password);
      });
    }

    async function handleReject(id, approver, password) {
      var reason = val('f_rejectReason');
      if (!reason) return;
      try {
        await api.reject({ id: id, approver: approver, reason: reason, password: password });
        document.getElementById('rejectDialogRoot').innerHTML = '';
        renderAdminDetail(id);
      } catch (err) {
        document.getElementById('rejectDialogRoot').innerHTML = '';
        document.getElementById('actionError').innerHTML = errorHtml(err.message);
      }
    }

    async function handleMarkComplete(id, password) {
      try {
        await api.markComplete({ id: id, password: password });
        renderAdminDetail(id);
      } catch (err) {
        document.getElementById('actionError').innerHTML = errorHtml(err.message);
      }
    }

    // ----------------------------- 404 -----------------------------

    function renderNotFound() {
      setApp(page(null, card(
        '<div class="text-center py-12"><p class="text-3xl font-bold text-slate-300 mb-2">404</p>' +
        '<p class="text-sm text-slate-500 mb-6">페이지를 찾을 수 없습니다.</p>' +
        secondaryLink('#/', '신청 페이지로 이동') + '</div>'
      )));
      wireCommonEvents();
    }
  </script>
</body>
</html>
